<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="妈妈走了三个月。棠安科技的「回声」说，把聊天记录交给它，就能再和她说说话。一个安静的模拟聊天恐怖短篇，四个晚上，三个结局。">
<meta property="og:title" content="她还在线">
<meta property="og:description" content="把妈妈的聊天记录交给「回声」，就能再和她说说话。四个晚上，三个结局。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='20' fill='%233b2f36'/%3E%3Cg fill='%23e4a0a8'%3E%3Ccircle cx='20' cy='12' r='5'/%3E%3Ccircle cx='27.5' cy='17.5' r='5'/%3E%3Ccircle cx='25' cy='26.5' r='5'/%3E%3Ccircle cx='15' cy='26.5' r='5'/%3E%3Ccircle cx='12.5' cy='17.5' r='5'/%3E%3C/g%3E%3Ccircle cx='20' cy='20' r='4.2' fill='%23f3d58a'/%3E%3C/svg%3E">
<title>她还在线</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <!-- 标题页 -->
  <section id="screen-title" class="screen title">
    <div class="brand">棠安科技 · 回声</div>
    <h1>她还在线</h1>
    <p>妈妈走了三个月。</p>
    <p>棠安科技的「回声」说，把你们的聊天记录交给它，就能再和她说说话。</p>
    <p>试用期 4 天。</p>
    <button id="btn-start" class="btn primary">开通回声</button>
    <div id="title-sub" class="title-sub"></div>
  </section>

  <!-- 聊天页 -->
  <section id="screen-chat" class="screen chat hidden">
    <header class="head">
      <div id="avatar" class="avatar"></div>
      <div class="who">
        <div class="name">妈妈 <span id="badge" class="badge">回声</span></div>
        <div id="status" class="status">在线</div>
      </div>
      <div class="sim" title="回声与她的相似度">
        <div class="sim-label">相似度</div>
        <div id="sim" class="sim-val">41%</div>
      </div>
    </header>
    <div id="msgs" class="msgs"></div>
    <div id="panel" class="panel"></div>
  </section>

  <!-- 遮罩：每晚结束 / 结局 -->
  <div id="overlay" class="overlay hidden">
    <div class="card">
      <div id="ov-kicker" class="ov-kicker"></div>
      <div id="ov-title" class="ov-title"></div>
      <div id="ov-text" class="ov-text"></div>
      <button id="ov-btn" class="btn primary"></button>
    </div>
  </div>

</div>

<template id="avatar-svg">
  <svg viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="20" class="av-bg"/>
    <g class="av-petal">
      <circle cx="20" cy="12" r="5"/><circle cx="27.5" cy="17.5" r="5"/><circle cx="25" cy="26.5" r="5"/>
      <circle cx="15" cy="26.5" r="5"/><circle cx="12.5" cy="17.5" r="5"/>
    </g>
    <circle cx="20" cy="20" r="4.2" class="av-core"/>
  </svg>
</template>

<script src="js/story.js"></script>
<script src="js/game.js"></script>
</body>
</html>
