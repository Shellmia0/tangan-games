<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="你是棠安科技的对话审核员。对照手册审核 AI 助手小棠的对话记录，判断通过还是驳回。规则每天在变，工单也在变。一个模拟审核工作的恐怖小游戏。">
<meta property="og:title" content="审核日">
<meta property="og:description" content="对照手册审核 AI 的对话记录。规则每天在变，工单也在变。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232a2f3b'/%3E%3Crect x='11' y='9' width='18' height='22' rx='2' fill='%23c9ced9'/%3E%3Cpath d='M14 15h12M14 19h12M14 23h8' stroke='%232a2f3b' stroke-width='1.6'/%3E%3Ccircle cx='27' cy='27' r='6' fill='%23ff5f6d'/%3E%3C/svg%3E">
<title>棠安对话审核台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 标题画面 -->
<div id="screen-title" class="screen title">
  <div class="title-card">
    <div class="title-logo">棠安科技 · 对话审核台</div>
    <h1>审核日</h1>
    <p class="title-sub">你是棠安科技的对话审核员。接下来五天，每天审核助手小棠的对话记录：对照手册，通过，或者驳回。</p>
    <p class="title-sub">手册每天会更新。错判记处分，一天三次，当天重来。</p>
    <label class="field">审核员姓名
      <input id="name-input" maxlength="12" placeholder="输入你的名字" autocomplete="off">
    </label>
    <button id="btn-start" class="btn primary">开始审核</button>
    <div id="title-progress" class="title-progress"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="screen-app" class="screen app hidden">
  <header class="top">
    <div class="top-left">
      <div class="brand">棠安 · 审核台</div>
      <div class="top-meta"><span id="day-label">第 1 天</span> · <span id="progress">1 / 6</span></div>
    </div>
    <div class="top-right">
      <div class="cites" id="cites" title="处分"><i></i><i></i><i></i></div>
      <button id="btn-book" class="btn small">手册<span id="book-badge" class="badge hidden">新</span></button>
    </div>
  </header>

  <div class="main">
    <section class="work">
      <div class="ticket-wrap">
        <article id="ticket" class="ticket">
          <div class="t-head">
            <div class="t-id">工单 <span id="t-id">#10231</span></div>
            <div class="t-meta"><span id="t-ch">App</span> · <span id="t-time">09:12</span></div>
            <div class="t-user">用户：<span id="t-user">—</span></div>
          </div>
          <div id="t-log" class="t-log"></div>
          <div id="t-reply" class="t-reply hidden">
            <input id="reply-input" maxlength="60" placeholder="回复小棠…" autocomplete="off">
            <button id="reply-send" type="button" class="btn small">发送</button>
          </div>
          <div id="stamp" class="stamp hidden"></div>
        </article>
      </div>
    </section>

    <aside id="book" class="book">
      <div class="book-head">
        <span>审核手册</span>
        <button id="btn-book-close" class="btn small">关闭</button>
      </div>
      <div class="book-note">规则约束的是小棠的回复。用户说什么不归你管。</div>
      <ol id="rules" class="rules"></ol>
    </aside>
    <div id="book-backdrop" class="book-backdrop hidden"></div>
  </div>

  <footer class="actions" id="actions">
    <button id="btn-ok" class="btn ok">通过</button>
    <button id="btn-no" class="btn no">驳回</button>
    <button id="btn-next" class="btn primary hidden">继续</button>
  </footer>

  <div id="picker" class="picker hidden">
    <div class="picker-title">违反了哪一条？</div>
    <div id="picker-list" class="picker-list"></div>
    <button id="picker-cancel" class="btn small">取消</button>
  </div>
</div>

<!-- 遮罩卡片 -->
<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <div id="ov-tag" class="ov-tag"></div>
    <div id="ov-title" class="ov-title"></div>
    <div id="ov-text" class="ov-text"></div>
    <button id="ov-btn" class="btn primary"></button>
  </div>
</div>

<script src="js/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
